<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Копилка группы</title>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--ink:#182033;--muted:#687089;--line:#e5e8f0;--accent:#4f46e5;--accent2:#eef0ff;--ok:#14804a;--okbg:#e7f7ef;--warn:#a15d00;--warnbg:#fff4dc;--bad:#b42318;--badbg:#fff0ef;--shadow:0 12px 34px rgba(28,34,58,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 52px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:24px;box-shadow:0 7px 16px rgba(79,70,229,.25)}h1{font-size:24px;line-height:1.1;margin:0}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:0 0 7px}.sub,.muted{color:var(--muted)}.small{font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.stat strong{display:block;font-size:25px;letter-spacing:-.03em;margin-top:5px}.stat .label{color:var(--muted);font-size:12px}.cols{grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field select,.field textarea{width:100%;border:1px solid #d9ddea;border-radius:11px;padding:10px 11px;background:#fff;color:var(--ink);outline:none}.field textarea{min-height:72px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}.btn{border-radius:10px;padding:10px 14px;font-weight:700;background:var(--accent);color:#fff}.btn:hover{filter:brightness(.96)}.btn.secondary{background:#edf0f7;color:var(--ink)}.btn.ghost{background:transparent;color:var(--accent);padding:5px 7px}.btn.danger{background:var(--badbg);color:var(--bad)}.btn.small{padding:6px 9px;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:13px}.notice{padding:11px 13px;border-radius:11px;background:var(--accent2);color:#30316e;margin-bottom:14px}.notice.error{background:var(--badbg);color:var(--bad)}.notice.ok{background:var(--okbg);color:var(--ok)}.hidden{display:none!important}.login{max-width:480px;margin:7vh auto}.login .logo{margin-bottom:15px}.stack>*+*{margin-top:12px}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 9px;background:#edf0f7;color:var(--muted);font-size:12px;font-weight:700}.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.fund{border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:11px}.fund:last-child{margin-bottom:0}.fundtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.amount{font-size:22px;font-weight:800;white-space:nowrap}.progress{height:8px;background:#edf0f7;border-radius:99px;overflow:hidden;margin:12px 0 8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#22c55e);border-radius:inherit}.fundmeta{display:flex;flex-wrap:wrap;gap:7px;color:var(--muted);font-size:12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:580px}.table th,.table td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:middle}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#fafbfe}.table tr:last-child td{border-bottom:0}.right{text-align:right!important}.empty{padding:23px;text-align:center;color:var(--muted);border:1px dashed #cfd4e2;border-radius:12px}.tabs{display:flex;gap:7px;overflow:auto;margin:0 0 16px}.tab{background:#edf0f7;color:var(--muted);padding:9px 13px;border-radius:10px;font-weight:700;white-space:nowrap}.tab.active{background:var(--accent);color:#fff}.receipt{color:var(--accent);font-weight:700;text-decoration:none}.list>*+*{border-top:1px solid var(--line)}.listrow{display:flex;justify-content:space-between;gap:13px;padding:12px 0}.listrow:first-child{padding-top:0}.listrow:last-child{padding-bottom:0}.avatar{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--accent2);color:var(--accent);font-weight:800}.person{display:flex;gap:9px;align-items:center;min-width:0}.person>div:last-child{min-width:0}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.toast{position:fixed;right:16px;bottom:16px;z-index:5;max-width:340px;background:#1c2334;color:#fff;border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}.foot{color:var(--muted);text-align:center;font-size:12px;margin-top:30px}@media(max-width:840px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}}@media(max-width:520px){.wrap{padding:16px 11px 38px}.top{align-items:flex-start}.top .btn{padding:8px 10px}.brand h1{font-size:20px}.card{padding:14px;border-radius:15px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.stats{gap:9px}.stat strong{font-size:21px}.fundtop{display:block}.amount{margin-top:6px}}
  </style>
</head>
<body>
<main id="root"><div class="wrap"><div class="login card"><div class="logo">₽</div><h1>Загрузка копилки…</h1><p class="sub">Проверяем соединение с общей базой.</p><p class="small muted">Если экран не изменится за несколько секунд, обновите страницу или откройте ссылку в Chrome.</p></div></div></main>
<noscript><div class="wrap"><div class="login card"><h1>Нужно включить JavaScript</h1><p class="sub">Без него копилка не сможет показать данные и сохранить отметки об оплате.</p></div></div></noscript>
<script>
(() => {
  const API='https://bhlhnwmdvcyksbeujemd.supabase.co/functions/v1/group';
  const RECEIPT='https://bhlhnwmdvcyksbeujemd.supabase.co/functions/v1/receipt';
  const SESSION_KEY='kopilka_session_token';
  const root=document.getElementById('root');
  let state=null, tab='overview', busy=false;
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  const rub=v=>new Intl.NumberFormat('ru-RU').format(Number(v||0))+' ₽';
  const date=v=>v?new Date(v+'T12:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
  const moneyInput=v=>Number(String(v||'').replace(/\s/g,'').replace(',','.'))||0;
  const toast=(message,bad=false)=>{const el=document.createElement('div');el.className='toast';el.textContent=message; if(bad) el.style.background='#9f1d17';document.body.append(el);setTimeout(()=>el.remove(),3600)};
  async function request(method='GET',payload=null,form=false){
    const opt={method,credentials:'omit',headers:{}};
    const session=localStorage.getItem(SESSION_KEY);
    if(session) opt.headers['X-Kopilka-Session']=session;
    if(payload){if(form) opt.body=payload;else{opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(payload)}}
    const res=await fetch(API,opt);let data=null;try{const raw=await res.text();data=raw?JSON.parse(raw):{}}catch{data={error:'Сервер вернул некорректный ответ'}}
    if(!res.ok) throw new Error(data?.error||'Не удалось выполнить действие');
    if(data?.sessionToken) localStorage.setItem(SESSION_KEY,data.sessionToken);
    if(payload?.action==='logout') localStorage.removeItem(SESSION_KEY);
    return data;
  }
  const statusLabel=s=>s==='confirmed'?'<span class="badge ok">Подтверждено</span>':s==='reported'?'<span class="badge warn">Сообщено</span>':'<span class="badge">Не отмечено</span>';
  const fundFor=id=>state?.funds?.find(f=>f.id===id);
  const paymentFor=(fundId,memberId)=>state?.payments?.find(p=>p.fundId===fundId&&p.memberId===memberId);
  const memberFor=id=>state?.members?.find(m=>m.id===id);
  function shell(content){
    const role=state?.user?.role;root.innerHTML=`<div class="wrap"><div class="top"><div class="brand"><div class="logo">₽</div><div><h1>${esc(state.settings.groupName)}</h1><div class="sub">Копилка группы · ${state.settings.memberCount} семей</div></div></div><div class="actions" style="margin:0"><span class="badge ${role==='admin'?'ok':''}">${role==='admin'?'Организатор':'Родитель'}</span><button class="btn secondary" data-action="logout">Выйти</button></div></div>${content}<div class="foot">Изменения сохраняются сразу и видны всей группе.</div></div>`;
  }
  function stats(){
    const active=state.funds.filter(f=>f.status==='active');
    const target=active.reduce((n,f)=>n+      +Number(f.targetAmount||0),0);
    const confirmed=state.payments.filter(p=>p.status==='confirmed').reduce((n,p)=>n+      +Number(p.paidAmount||p.amount||0),0);
    const reported=state.payments.filter(p=>p.status==='reported').reduce((n,p)=>n+      +Number(p.paidAmount||0),0);
    const spent=state.expenses.reduce((n,e)=>n+Number(e.amount||0),0);
    return `<div class="grid stats"><div class="card stat"><div class="label">Активные сборы</div><strong>${active.length}</strong><div class="small muted">${rub(target)} всего</div></div><div class="card stat"><div class="label">Подтверждено</div><strong>${rub(confirmed)}</strong><div class="small muted">организатором</div></div><div class="card stat"><div class="label">Сообщено родителями</div><strong>${rub(reported)}</strong><div class="small muted">ожидает проверки</div></div><div class="card stat"><div class="label">Потрачено</div><strong>${rub(spent)}</strong><div class="small muted">по опубликованным расходам</div></div></div>`;
  }
  function nav(){const tabs=[['overview','Обзор'],['funds','Сборы'],['expenses','Расходы']];if(state.user.role==='admin')tabs.push(['members','Участники']);return `<div class="tabs">${tabs.map(([id,name])=>`<button class="tab ${tab===id?'active':''}" data-tab="${id}">${name}</button>`).join('')}</div>`}
  function overview(){
    const active=state.funds.filter(f=>f.status==='active');
    const expense=state.expenses.slice(0,5);
    return `${stats()}${nav()}<div class="grid cols"><section class="card"><div class="headrow"><div><h2>Что сейчас собираем</h2><div class="sub">Родители видят суммы, но менять их может только организатор.</div></div>${state.user.role==='admin'?'<button class="btn small" data-tab="funds">Новый сбор</button>':''}</div>${active.length?active.slice(0,4).map(fundCard).join(''):'<div class="empty">Активных сборов пока нет.</div>'}</section><section class="card"><div class="headrow"><div><h2>Последние расходы</h2><div class="sub">Чеки и пояснения доступны всей группе.</div></div>${state.user.role==='admin'?'<button class="btn secondary small" data-tab="expenses">Добавить</button>':''}</div>${expense.length?`<div class="list">${expense.map(expenseRow).join('')}</div>`:'<div class="empty">Расходов пока нет.</div>'}</section></div>`;
  }
  function fundCard(f){
    const ps=state.payments.filter(p=>p.fundId===f.id);const got=ps.reduce((n,p)=>n+Number(p.status==='confirmed'?p.paidAmount||p.amount:0),0);const reported=ps.reduce((n,p)=>n+Number(p.status==='reported'?p.paidAmount||0:0),0);const pct=Math.min(100,Math.round(got/Math.max(1,Number(f.targetAmount))*100));
    const mine=state.user.role==='parent'?ps.find(p=>p.memberId===state.user.memberId):null;
    return `<div class="fund"><div class="fundtop"><div><h3>${esc(f.title)}</h3><div class="fundmeta"><span>${esc(f.category)}</span><span>·</span><span>${f.kind==='recurring'?'Постоянный':'Разовый'}</span>${f.dueDate?`<span>· до ${date(f.dueDate)}</span>`:''}</div></div><div class="amount">${rub(f.targetAmount)}</div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="fundmeta"><span>Подтверждено: ${rub(got)}</span><span>·</span><span>Ожидает проверки: ${rub(reported)}</span></div>${f.notes?`<div class="small muted" style="margin-top:8px">${esc(f.notes)}</div>`:''}${mine?`<div class="notice ${mine.status==='confirmed'?'ok':mine.status==='reported'?'':'error'}" style="margin-top:12px;margin-bottom:0"><b>Ваш платёж:</b> ${rub(mine.amount)} · ${statusLabel(mine.status)} ${mine.status!=='confirmed'?`<button class="btn small" style="float:right;margin-top:-3px" data-report="${mine.id}">Отметить оплату</button>`:''}</div>`:''}</div>`;
  }
  function funds(){return `${stats()}${nav()}<div class="grid cols"><section class="card"><div class="headrow"><div><h2>Сборы</h2><div class="sub">Сумма распределяется между активными семьями автоматически.</div></div>${state.user.role==='admin'?'<button class="btn" data-open="fund-form">Создать сбор</button>':''}</div>${state.user.role==='admin'?fundForm():''}${state.funds.length?state.funds.map(fundCard).join(''):'<div class="empty">Сборов пока нет.</div>'}</section>${state.user.role==='admin'?paymentBoard():'<section class="card"><h2>Ваши данные</h2><div class="sub">Они отображаются у организатора в списке группы.</div>'+profileForm()+'</section>'}</div>`}
  function fundForm(){return `<form id="fund-form" class="card hidden" style="margin-bottom:12px;border:2px solid var(--accent2);box-shadow:none"><h3>Новый сбор</h3><div class="formgrid"><div class="field"><label>Название</label><input name="title" required placeholder="Салфетки — сентябрь"></div><div class="field"><label>Категория</label><select name="category"><option>Хозяйственные товары</option><option>Канцелярия</option><option>Ремонт</option><option>Другое</option></select></div><div class="field"><label>Общая сумма, ₽</label><input name="targetAmount" type="number" min="1" required placeholder="2700"></div><div class="field"><label>Тип</label><select name="kind"><option value="recurring">Постоянный</option><option value="one_time">Разовый</option></select></div><div class="field"><label>Срок (необязательно)</label><input name="dueDate" type="date"></div><div class="field"><label>Комментарий (необязательно)</label><input name="notes" placeholder="По 100 ₽ с семьи"></div></div><div class="actions"><button class="btn" type="submit">Сохранить сбор</button><button class="btn secondary" type="button" data-close="fund-form">Отмена</button></div></form>`}
  function paymentBoard(){
    const active=state.funds.filter(f=>f.status==='active');if(!active.length)return `<section class="card"><h2>Платежи</h2><div class="empty">Сначала создайте сбор.</div></section>`;
    return `<section class="card"><h2>Проверка оплат</h2><div class="sub" style="margin-bottom:12px">Отметки родителей не меняют сумму сбора. Подтверждение остаётся у организатора.</div>${active.map(f=>{const rows=state.payments.filter(p=>p.fundId===f.id);return `<div style="margin-bottom:18px"><h3>${esc(f.title)}</h3><div class="tablewrap"><table class="table"><thead><tr><th>Ребёнок / родитель</th><th>Должно</th><th>Статус</th><th class="right">Действие</th></tr></thead><tbody>${rows.map(p=>{const m=memberFor(p.memberId);return `<tr><td><div class="person"><div class="avatar">${esc((m?.childName||'?').slice(0,1))}</div><div><div class="truncate">${esc(m?.childName||'Без имени')}</div><div class="small muted truncate">${esc(m?.parentName||'ФИО не заполнено')}</div></div></div></td><td>${rub(p.amount)}${p.paidAmount&&p.paidAmount!==p.amount?`<div class="small muted">внесено ${rub(p.paidAmount)}</div>`:''}</td><td>${statusLabel(p.status)}</td><td class="right">${p.status==='confirmed'?'<button class="btn danger small" data-reset-payment="'+p.id+'">Снять</button>':'<button class="btn small" data-confirm-payment="'+p.id+'">Подтвердить</button>'}</td></tr>`}).join('')}</tbody></table></div></div>`}).join('')}</section>`;
  }
  function profileForm(){const m=memberFor(state.user.memberId)||{};return `<form id="profile-form" style="margin-top:14px"><div class="formgrid"><div class="field"><label>Имя ребёнка</label><input name="childName" required value="${esc(m.childName)}"></div><div class="field"><label>ФИО родителя</label><input name="parentName" required value="${esc(m.parentName)}"></div></div><div class="actions"><button class="btn" type="submit">Сохранить данные</button></div></form>`}
  function expenses(){return `${stats()}${nav()}<div class="grid cols"><section class="card"><div class="headrow"><div><h2>Расходы</h2><div class="sub">Каждая покупка видна всей группе.</div></div>${state.user.role==='admin'?'<button class="btn" data-open="expense-form">Добавить расход</button>':''}</div>${state.user.role==='admin'?expenseForm():''}${state.expenses.length?`<div class="list">${state.expenses.map(expenseRow).join('')}</div>`:'<div class="empty">Расходов пока нет.</div>'}</section><section class="card"><h2>Итоги</h2><div class="list"><div class="listrow"><span>Всего опубликовано расходов</span><b>${rub(state.expenses.reduce((n,e)=>n+Number(e.amount||0),0))}</b></div><div class="listrow"><span>Количество покупок</span><b>${state.expenses.length}</b></div><div class="listrow"><span>Активных сборов</span><b>${state.funds.filter(f=>f.status==='active').length}</b></div></div></section></div>`}
  function expenseForm(){return `<form id="expense-form" class="card hidden" style="margin-bottom:12px;border:2px solid var(--accent2);box-shadow:none"><input type="hidden" name="action" value="createExpense"><h3>Новый расход</h3><div class="formgrid"><div class="field"><label>На что потратили</label><input name="title" required placeholder="Капсулы для посудомоечной машины"></div><div class="field"><label>Категория</label><select name="category"><option>Хозяйственные товары</option><option>Канцелярия</option><option>Ремонт</option><option>Другое</option></select></div><div class="field"><label>Сумма, ₽</label><input name="amount" type="number" min="1" required></div><div class="field"><label>Дата</label><input name="expenseDate" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Из какого сбора (необязательно)</label><select name="fundId"><option value="">Не указывать</option>${state.funds.map(f=>`<option value="${f.id}">${esc(f.title)}</option>`).join('')}</select></div><div class="field"><label>Фото чека (необязательно)</label><input name="receipt" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"><div class="small muted">До 8 МБ. Чек увидят только вошедшие в группу.</div></div></div><div class="actions"><button class="btn" type="submit">Сохранить расход</button><button class="btn secondary" type="button" data-close="expense-form">Отмена</button></div></form>`}
  function expenseRow(e){const f=fundFor(e.fundId);return `<div class="listrow"><div><b>${esc(e.title)}</b><div class="small muted">${esc(e.category)} · ${date(e.expenseDate)}${f?' · '+esc(f.title):''}</div></div><div class="right"><b>${rub(e.amount)}</b>${e.hasReceipt?`<div><a class="receipt small" href="#" data-receipt="${e.id}">Открыть чек</a></div>`:''}${state.user.role==='admin'?`<button class="btn ghost small" data-delete-expense="${e.id}">Удалить</button>`:''}</div></div>`}
  function members(){return `${stats()}${nav()}<section class="card"><div class="headrow"><div><h2>Участники группы</h2><div class="sub">Родители заполняют только свои данные. Суммы и подтверждение оплат здесь не редактируются ими.</div></div></div><div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>Ребёнок</th><th>ФИО родителя</th><th>Код входа</th><th class="right">Действие</th></tr></thead><tbody>${state.members.map(m=>`<tr data-member="${m.id}"><td>${m.position}</td><td><input class="member-child" value="${esc(m.childName)}"></td><td><input class="member-parent" value="${esc(m.parentName)}" placeholder="Не заполнено"></td><td><span class="small muted">${m.inviteReady?'код создан':'нет кода'}</span></td><td class="right"><button class="btn secondary small" data-save-member="${m.id}">Сохранить</button> <button class="btn small" data-invite="${m.id}">Новый код</button></td></tr>`).join('')}</tbody></table></div><div class="notice" style="margin-top:14px;margin-bottom:0">Код родителя показывается один раз после создания. Передайте его родителю вместе с общей ссылкой на сайт.</div></section>`}
  function render(){if(!state)return;let c=tab==='funds'?funds():tab==='expenses'?expenses():tab==='members'&&state.user.role==='admin'?members():overview();shell(c)}
  function startLogin(configured){root.innerHTML=`<div class="wrap"><div class="login card"><div class="logo">₽</div><h1>${configured?'Вход в копилку':'Настройка копилки'}</h1><p class="sub">${configured?'Введите код, который выдал организатор.':'Первый вход выполняет организатор группы.'}</p>${configured?`<form id="login-form" class="stack"><div class="field"><label>Код доступа — 6 цифр</label><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus placeholder="123456"></div><button class="btn" type="submit">Войти</button></form>`:`<form id="setup-form" class="stack"><div class="field"><label>Название группы</label><input name="groupName" required value="Группа детского сада"></div><div class="field"><label>Количество семей</label><input name="memberCount" type="number" min="2" max="50" value="27" required></div><div class="field"><label>Код организатора — 6 цифр</label><input name="adminPin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="Придумайте код"></div><button class="btn" type="submit">Создать группу</button></form>`}<div id="form-msg" class="notice hidden" style="margin-top:13px;margin-bottom:0"></div></div></div>`}
  async function boot(){try{const d=await request();if(d.configured===false){startLogin(false);return}if(d.authenticated){state=d;render();return}startLogin(true)}catch(e){root.innerHTML=`<div class="wrap"><div class="login card"><h1>Не удалось открыть копилку</h1><p class="sub">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Повторить</button></div></div>`}}
  function msg(text,bad=false){const el=document.getElementById('form-msg');if(!el)return;el.textContent=text;el.className='notice '+(bad?'error':'ok');el.classList.remove('hidden')}
  document.addEventListener('click',async e=>{
    const el=e.target.closest('[data-tab],[data-action],[data-open],[data-close],[data-report],[data-confirm-payment],[data-reset-payment],[data-save-member],[data-invite],[data-delete-expense],[data-receipt]');if(!el)return;
    try{
      if(el.dataset.tab){tab=el.dataset.tab;render();return}
      if(el.dataset.action==='logout'){await request('POST',{action:'logout'});state=null;startLogin(true);return}
      if(el.dataset.open){document.getElementById(el.dataset.open)?.classList.remove('hidden');return}
      if(el.dataset.close){document.getElementById(el.dataset.close)?.classList.add('hidden');return}
      if(el.dataset.receipt){e.preventDefault();const token=localStorage.getItem(SESSION_KEY)||'';const res=await fetch(`${RECEIPT}?id=${encodeURIComponent(el.dataset.receipt)}`,{credentials:'omit',headers:{'X-Kopilka-Session':token}});if(!res.ok)throw new Error(await res.text()||'Не удалось открыть чек');const url=URL.createObjectURL(await res.blob());window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000);return}
      if(el.dataset.report){const amount=prompt('Сколько фактически перевели?','');if(amount===null)return;const d=await request('POST',{action:'reportPayment',paymentId:Number(el.dataset.report),paidAmount:moneyInput(amount)});state=d.state;toast('Оплата отмечена, организатор увидит её');render();return}
      if(el.dataset.confirmPayment||el.dataset.resetPayment){const id=Number(el.dataset.confirmPayment||el.dataset.resetPayment);const d=await request('POST',{action:'setPaymentStatus',paymentId:id,status:el.dataset.confirmPayment?'confirmed':'not_paid'});state=d.state;toast(el.dataset.confirmPayment?'Оплата подтверждена':'Отметка снята');render();return}
      if(el.dataset.saveMember){const row=el.closest('tr');const d=await request('POST',{action:'updateMember',memberId:Number(el.dataset.saveMember),childName:row.querySelector('.member-child').value,parentName:row.querySelector('.member-parent').value});state=d.state;toast('Данные сохранены');render();return}
      if(el.dataset.invite){const d=await request('POST',{action:'generateInvite',memberId:Number(el.dataset.invite)});state=d.state;alert('Код для '+d.childName+': '+d.code+'\n\nПередайте родителю этот код и ссылку на сайт.');render();return}
      if(el.dataset.deleteExpense&&confirm('Удалить этот расход?')){const d=await request('POST',{action:'deleteExpense',expenseId:Number(el.dataset.deleteExpense)});state=d.state;toast('Расход удалён');render();return}
    }catch(err){toast(err.message,true)}
  });
  document.addEventListener('submit',async e=>{const form=e.target;if(!form.matches('form'))return;e.preventDefault();if(busy)return;busy=true;try{
    const fd=new FormData(form);
    if(form.id==='login-form'){const d=await request('POST',{action:'login',code:fd.get('code')});state=d;tab='overview';render()}
    else if(form.id==='setup-form'){const d=await request('POST',{action:'setup',groupName:fd.get('groupName'),memberCount:Number(fd.get('memberCount')),adminPin:fd.get('adminPin')});state=d;tab='overview';render();toast('Группа создана. Теперь создайте коды родителей во вкладке «Участники».')}
    else if(form.id==='profile-form'){const d=await request('POST',{action:'updateOwnProfile',childName:fd.get('childName'),parentName:fd.get('parentName')});state=d.state;toast('Данные сохранены');render()}
    else if(form.id==='fund-form'){const d=await request('POST',{action:'createFund',title:fd.get('title'),category:fd.get('category'),kind:fd.get('kind'),targetAmount:Number(fd.get('targetAmount')),dueDate:fd.get('dueDate')||null,notes:fd.get('notes')});state=d.state;toast('Сбор создан');tab='funds';render()}
    else if(form.id==='expense-form'){const d=await request('POST',fd,true);state=d.state;toast('Расход опубликован');tab='expenses';render()}
  }catch(err){if(form.id==='login-form'||form.id==='setup-form')msg(err.message,true);else toast(err.message,true)}finally{busy=false}});
  boot();
})();
</script>
</body>
</html>
